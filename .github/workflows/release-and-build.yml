name: release-and-build

# Uma release é uma tag "vX.Y.Z" empurrada pro repositório:
#   git tag v0.1.0 && git push origin v0.1.0
# Isso roda os testes e, se passarem, builda e publica a imagem no GHCR com a tag da
# versão e "latest" apontando pra ela, no mesmo build.
on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Testar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npx tsc -b --noEmit

  build-and-push:
    name: Build e publicar imagem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags/labels da imagem)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=true

      - name: Recusar sobrescrever uma versão já publicada
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          if docker manifest inspect "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Erro: a tag ${VERSION} já existe no registry — versões publicadas não são sobrescritas." >&2
            echo "Corrija/adicione uma feature e publique como uma versão nova (PATCH/MINOR/MAJOR)." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
